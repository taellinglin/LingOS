# LingOS Studio for the Raspberry Pi 5: the desktop (apps/lingdesk) with the
# user's three studios and the browser compiled into ONE kernel image --
# LingStationX (music, ../LingStationX), LingDev (games, ../LingDev),
# LingModeler (2D/3D, ../LingModeler) and Horizon (web, ../horizon-browser/ling)
# -- the real apps, not copies. Each is a built-in app (start menu, dock;
# Ctrl+Q returns to the desktop) on the in-kernel Ling runtime, with its own
# folder in the user's home: projects in Projects/<App>, settings in
# Programs/<App>, and its bundled files under apps/<name>/ in the image.
#   ling build kernel/rpi-studio --platform rpi --out dist-lsx
[project]
name = "lingos-studio-rpi"
version = "0.1.0"
entry = "../../apps/lingdesk/main.ling"
kind = "kernel"

[app.lingstation]
entry = "../../../LingStationX/ling/main.ling"
root = "../../../LingStationX"
# fonts + the default startup project (Anthem of Ling Country) and FunKey (its
# project file only -- its 400 MB of audio stems stay on the PC).
includes = ["assets/font.ttf", "assets/fonts/Daemon.otf", "assets/fonts/Chesilin.ttf", "assets/templates/Anthem of Ling Country/project.json", "projects/FunKey/project.json"]

[app.lingdev]
entry = "../../../LingDev/ling/main_os.ling"
root = "../../../LingDev"
# the font, the sample projects (Demo, CutDemo, MenuDemo, Ling Breaker, Soul Symphony 2019,
# Moko's Picture Book -- scenes, scripts, models, levels, fonts, sound effects and the Ling Breaker
# title music; Soul Symphony's textures as a selection: the ball, portals, UI, a few of the 100
# floor / wall / ceiling patterns, stars, NPC faces and emblems). The stage music and Soul
# Symphony's audio stay out: the image has to fit the 63 MB boot partition.
includes = ["assets/font.ttf", "assets/fonts/Daemon.otf", "!projects/Demo/lingdev.toml", "!projects/Demo/scenes/*.lscene", "!projects/Demo/scripts/*.ling", "!projects/CutDemo/lingdev.toml", "!projects/CutDemo/scenes/*.lscene", "!projects/CutDemo/scripts/*.ling", "!projects/MenuDemo/lingdev.toml", "!projects/MenuDemo/scenes/*.lscene", "!projects/MenuDemo/scripts/*.ling", "!projects/LingBreaker/lingdev.toml", "!projects/LingBreaker/scenes/*.lscene", "!projects/LingBreaker/scripts/*.ling", "!projects/SoulSymphonyZH/lingdev.toml", "!projects/SoulSymphonyZH/scenes/*.lscene", "!projects/SoulSymphonyZH/scripts/*.ling", "!projects/SoulSymphonyZH/assets/models/*.ltm", "!projects/SoulSymphonyZH/assets/levels/*.ltm", "!projects/SoulSymphonyZH/assets/text/*", "!projects/SoulSymphonyZH/cache/fonts/*/*", "!projects/SoulSymphonyZH/assets/textures/ball/*", "!projects/SoulSymphonyZH/assets/textures/portals/*", "!projects/SoulSymphonyZH/assets/textures/monster/*", "!projects/SoulSymphonyZH/assets/textures/ui/*.svgz", "!projects/SoulSymphonyZH/assets/textures/patterns/floor/0010?-*.svgz", "!projects/SoulSymphonyZH/assets/textures/patterns/wall/0040?-*.svgz", "!projects/SoulSymphonyZH/assets/textures/patterns/ceiling/0000?-*.svgz", "!projects/SoulSymphonyZH/assets/textures/stars/0001?-*.svgz", "!projects/SoulSymphonyZH/assets/textures/npc/emblems/*.svgz", "!projects/SoulSymphonyZH/assets/textures/npc/faces/0047?-*.svgz", "!projects/LingBreaker/assets/fonts/ui.ttf", "!projects/LingBreaker/assets/sfx/*.wav", "!projects/LingBreaker/assets/music/*.beats", "!projects/LingBreaker/assets/music/CREDITS.txt", "!projects/LingBreaker/assets/music/title.wav", "!projects/LingBreaker/cache/fonts/*/*", "!projects/MokoStory/lingdev.toml", "!projects/MokoStory/scenes/*.lscene", "!projects/MokoStory/scripts/*.ling", "!projects/MokoStory/assets/sfx/*.wav", "!projects/MokoStory/assets/music/*.beats", "!projects/MokoStory/cache/fonts/*/*", "assets/charts/*.chart", "assets/sfx/dance/*.wav", "!projects/SoulSymphonyZH/assets/audio/boing0?.wav", "!projects/SoulSymphonyZH/assets/audio/portal_loop*.wav", "!projects/SoulSymphonyZH/assets/audio/start-dialog.wav", "!projects/SoulSymphonyZH/assets/audio/ball-jump.wav", "!projects/SoulSymphonyZH/assets/audio/hover.wav", "!projects/SoulSymphonyZH/assets/audio/warp.wav", "!projects/SoulSymphonyZH/assets/audio/ball_roll.wav", "!projects/SoulSymphonyZH/assets/audio/pickup.wav", "!projects/LingLingRevolution/lingdev.toml", "!projects/LingLingRevolution/scenes/*.lscene", "!projects/LingLingRevolution/scripts/*.ling", "!projects/LingLingRevolution/assets/midi/*.mid", "!projects/LingLingRevolution/assets/fonts/ui.ttf"]

[app.lingmodeler]
entry = "../../../LingModeler/ling/main_os.ling"
root = "../../../LingModeler"
includes = ["assets/font.ttf", "examples/*.lmesh", "examples/*.ling", "examples/*.svg"]

[app.horizon]
entry = "../../../horizon-browser/ling/main_os.ling"
root = "../../../horizon-browser"
includes = ["assets/font.ttf", "assets/home.html"]

[app.messenger]
# the Pi desktop's Messenger window (LingOS/apps/messenger), over the kernel's ling-messenger embedder
entry = "../../apps/messenger/main.ling"
root = "../../../LingStationX"
includes = ["assets/font.ttf"]
