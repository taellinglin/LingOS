[project]
name = "lingos-wm-x86_64"
version = "0.1.0"
entry = "main.ling"
kind = "kernel"
graphics = true
# LingStationX (LingOS Edition) ships with the desktop: the real app from
# ../LingStationX, compiled into this image as a built-in app (Applications menu
# -> Sound & Video). Its files are baked in, named relative to the app folder.
bundle_app = "lingstation:../../../LingStationX/ling/main.ling"
embed_root = "../../../LingStationX"
# + the default startup project (Anthem of Ling Country) and FunKey (its
# project file only -- its 400 MB of audio stems need a storage driver first).
includes = ["assets/font.ttf", "assets/fonts/Daemon.otf", "assets/fonts/Chesilin.ttf", "assets/templates/Anthem of Ling Country/project.json", "projects/FunKey/project.json"]
