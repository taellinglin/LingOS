[project]
name = "lingos-wm-x86_64"
version = "0.1.0"
entry = "main.ling"
kind = "kernel"
graphics = true
# LingStationX (LingOS Edition) ships with the desktop: the real app from
# ../LingStationX, compiled into this image as a built-in app (Applications menu
# -> Sound & Video). Its files are baked in, named relative to the app folder.
bundle_app = "lingstation:../../../LingStationX/ling/main.ling"
embed_root = "../../../LingStationX"
# + the default startup project (Anthem of Ling Country) and FunKey (its
# project file only -- its 400 MB of audio stems need a storage driver first).
includes = ["assets/font.ttf", "assets/fonts/Daemon.otf", "assets/fonts/Chesilin.ttf", "assets/templates/Anthem of Ling Country/project.json", "projects/FunKey/project.json"]

[app.wallet]
# Ling Wallet (../ling-wallet): wallet, full node and HyperTorus miner. The UI is the real app; its
# node, wallet and miner isolates are the iso_* programs below (thread_spawn runs them as green
# threads). Chain and keys live in the user's home: Programs/LingWallet/mainnet.
entry = "../../../ling-wallet/ling/main.ling"
root = "../../../ling-wallet"
includes = ["ling/assets/fonts/*", "ling/assets/*.lwseeds"]

[app.iso_node]
entry = "../../apps/wallet/iso_node.ling"
root = "../../../ling-wallet"

[app.iso_walletd]
entry = "../../apps/wallet/iso_walletd.ling"
root = "../../../ling-wallet"

[app.iso_miner]
entry = "../../apps/wallet/iso_miner.ling"
root = "../../../ling-wallet"
