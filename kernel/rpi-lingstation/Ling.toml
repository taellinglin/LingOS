# LingOS for Raspberry Pi with its desktop: the kernel boots straight into the
# LingOS desktop (apps/lingdesk -- taskbar, start menu, desktop icons, mouse +
# keyboard), with LingStationX -- the real app from ../LingStationX, not a copy --
# compiled into the same image as a built-in app (start menu / desktop icon;
# Ctrl+Q returns to the desktop). Everything runs on the in-kernel Ling runtime
# (ling-kernel's `lingrt`/`lingapp`).
[project]
name = "lingos-lingstation-rpi"
version = "0.1.0"
entry = "../../apps/lingdesk/main.ling"
kind = "kernel"
bundle_app = "lingstation:../../../LingStationX/ling/main.ling"
# Files the desktop and LingStationX read, baked into the kernel image until
# LingOS can read the SD card. Names are relative to the app folder, so its own
# paths find them.
embed_root = "../../../LingStationX"
includes = ["assets/font.ttf", "assets/fonts/Daemon.otf", "assets/fonts/Chesilin.ttf"]
