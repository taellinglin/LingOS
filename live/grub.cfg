# A real timeout so the menu is an actual choice, not an instant auto-boot
# -- picking Live/Install/Rescue only means something if there's time to
# pick.
set timeout=8
set default=0

# "Live" now boots the graphics-mode desktop (kernel/x86_64-wm), not the
# text shell -- the text shell (lingos-x86_64.elf) is still real and still
# boots below, as Rescue, and as this entry's own effective fallback: the
# desktop kernel checks ling_kernel_fb_available() itself and falls back to
# printing a message rather than a black screen if GRUB couldn't hand it a
# framebuffer, but it can't fall all the way back to a different *kernel
# image* -- if you land on a genuinely graphics-incapable setup, use Rescue.
menuentry "LingOS (Live)" {
    multiboot2 /boot/lingos-wm-x86_64.elf
    boot
}

# Same installer logic either way (apps/installer/main.ling, `use`-shared
# by both kernel images below) -- these differ only in front-end (graphics
# vs VGA text), not in what installing actually does.
menuentry "LingOS (Install - GUI)" {
    multiboot2 /boot/lingos-installer-gui-x86_64.elf
    module2 /boot/diskboot.img "diskboot"
    boot
}

menuentry "LingOS (Install - text)" {
    multiboot2 /boot/lingos-installer-x86_64.elf
    module2 /boot/diskboot.img "diskboot"
    boot
}

# Rescue = the original text-mode Live image, not a fifth kernel build: the
# text shell (mount/inspect lingfs, no destructive disk-write path -- that's
# the installer's job) is already rescue-capable as-is, and it's the real
# fallback for hardware the graphics Live desktop above can't get a
# framebuffer on. Nothing in this kernel parses the Multiboot2 cmdline tag
# to differentiate boot targets from inside one image, and building that
# machinery just to print a different banner would be real, unnecessary
# complexity for what's actually just a second label on an existing entry.
menuentry "LingOS (Rescue)" {
    multiboot2 /boot/lingos-x86_64.elf
    boot
}
