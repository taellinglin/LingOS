# A real timeout so the menu is an actual choice, not an instant auto-boot
# -- picking Live/Install/Rescue only means something if there's time to
# pick.
set timeout=8
set default=0

menuentry "LingOS (Live)" {
    multiboot2 /boot/lingos-x86_64.elf
    boot
}

menuentry "LingOS (Install)" {
    multiboot2 /boot/lingos-installer-x86_64.elf
    module2 /boot/diskboot.img "diskboot"
    boot
}

menuentry "LingOS (Desktop)" {
    multiboot2 /boot/lingos-wm-x86_64.elf
    boot
}

# Rescue = the same Live image, not a fourth kernel build: the Live shell
# (mount/inspect lingfs, no destructive disk-write path -- that's the
# installer's job) is already rescue-capable as-is. Nothing in this kernel
# parses the Multiboot2 cmdline tag to differentiate boot targets from
# inside one image, and building that machinery just to print a different
# banner would be real, unnecessary complexity for what's actually just a
# second label on an existing entry.
menuentry "LingOS (Rescue)" {
    multiboot2 /boot/lingos-x86_64.elf
    boot
}
